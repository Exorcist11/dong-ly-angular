<app-dialog
  [visible]="isOpen"
  [header]="resolvedTitle"
  size="sm"
  [submitVariant]="danger ? 'danger' : 'primary'"
  [submitLabel]="resolvedConfirmText"
  [cancelLabel]="resolvedCancelText"
  [submitLoading]="loading"
  styleClass="dl-confirm-modal"
  (submitted)="onConfirm()"
  (cancelled)="onCancel()"
>
  <div class="confirm-modal-body">
    <p class="confirm-message">{{ message || ('common.dialogs.confirmMessage' | translate) }}</p>
  </div>
</app-dialog>
