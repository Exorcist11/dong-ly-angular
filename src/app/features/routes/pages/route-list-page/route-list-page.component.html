<div class="route-page-container">
  <!-- PAGE HEADER -->
  <app-page-header
    [title]="'routes.title' | translate"
    [subtitle]="'routes.subtitle' | translate"
    [breadcrumbs]="breadcrumbs()"
  >
    <div actions class="header-action-buttons">
      <app-button
        *appHasPermission="'ROUTE_MANAGE'"
        [label]="'routes.buttons.addRoute' | translate"
        variant="primary"
        icon="pi pi-plus"
        (clicked)="openCreateRouteDialog()"
      />
    </div>
  </app-page-header>

  <!-- ROUTES TABLE CARD -->
  <div class="saas-card table-card">
    <app-data-table
      [data]="routes()"
      [columns]="routeColumns()"
      [totalRecords]="totalRoutes()"
      [loading]="routeLoading()"
      [pageSize]="routePageSize()"
      [first]="routePage() * routePageSize()"
      [searchable]="true"
      searchPlaceholder="Tìm kiếm mã tuyến, tên tuyến..."
      [filters]="routeFilterConfigs()"
      (lazyLoad)="onRouteChangeLazy($event)"
      (searchChange)="onRouteSearch($event)"
      (filterChange)="onRouteFilterChange($event)"
    >
      <!-- CỘT CODE -->
      <ng-template appTableCell="code" let-item>
        <span class="route-code-tag">{{ item.code }}</span>
      </ng-template>

      <!-- CỘT NAME -->
      <ng-template appTableCell="name" let-item>
        <span class="route-name-text">{{ item.name }}</span>
      </ng-template>

      <!-- CỘT ORIGIN -->
      <ng-template appTableCell="originLocation" let-item>
        <span class="loc-text">{{ item.originLocation?.name }}</span>
      </ng-template>

      <!-- CỘT DESTINATION -->
      <ng-template appTableCell="destinationLocation" let-item>
        <span class="loc-text">{{ item.destinationLocation?.name }}</span>
      </ng-template>

      <!-- CỘT DISTANCE -->
      <ng-template appTableCell="distanceKm" let-item>
        <span>{{ item.distanceKm ? item.distanceKm + ' km' : '—' }}</span>
      </ng-template>

      <!-- CỘT TOTAL STOPS -->
      <ng-template appTableCell="totalStops" let-item>
        <span class="stops-count-badge">{{ item.totalStops }}</span>
      </ng-template>

      <!-- CỘT STATUS -->
      <ng-template appTableCell="status" let-item>
        <app-status-badge [status]="item.status" />
      </ng-template>

      <!-- CỘT ACTIONS -->
      <ng-template appTableCell="actions" let-item>
        <div class="row-actions">
          <!-- CẤU HÌNH ĐIỂM DỪNG -->
          <app-button
            *appHasPermission="'ROUTE_MANAGE'"
            icon="pi pi-list"
            variant="text"
            size="small"
            styleClass="action-btn config-btn"
            [tooltip]="'routes.buttons.configStops' | translate"
            tooltipPosition="top"
            (clicked)="openStopsConfigDialog(item)"
          />

          <!-- CHỈNH SỬA TUYẾN -->
          <app-button
            *appHasPermission="'ROUTE_MANAGE'"
            icon="pi pi-pencil"
            variant="text"
            size="small"
            styleClass="action-btn"
            [tooltip]="'common.actions.edit' | translate"
            tooltipPosition="top"
            (clicked)="openEditRouteDialog(item)"
          />

          <!-- KÍCH HOẠT / NGỪNG HOẠT ĐỘNG -->
          <app-button
            *appHasPermission="'ROUTE_MANAGE'"
            [icon]="item.status === 'ACTIVE' ? 'pi pi-ban' : 'pi pi-check-circle'"
            variant="text"
            size="small"
            [styleClass]="item.status === 'ACTIVE' ? 'action-btn danger-btn' : 'action-btn success-btn'"
            [tooltip]="(item.status === 'ACTIVE' ? 'routes.confirmations.deactivate' : 'routes.confirmations.activate') | translate"
            tooltipPosition="top"
            (clicked)="confirmToggleRouteStatus(item)"
          />
        </div>
      </ng-template>
    </app-data-table>
  </div>

  <!-- DIALOG FORM TUYẾN ĐƯỜNG -->
  <app-route-form-dialog
    [visible]="showRouteDialog()"
    [route]="editingRoute()"
    [locations]="locations()"
    [submitting]="routeDialogSubmitting()"
    (visibleChange)="showRouteDialog.set($event)"
    (save)="saveRoute($event)"
  />

  <!-- DIALOG CẤU HÌNH THỨ TỰ ĐIỂM DỪNG -->
  <app-route-stops-dialog
    [visible]="showStopsConfigDialog()"
    [route]="configuringRoute()"
    [availableStopPoints]="allStopPoints()"
    [submitting]="stopsConfigSubmitting()"
    (visibleChange)="showStopsConfigDialog.set($event)"
    (save)="saveStopsConfig($event)"
  />

  <!-- MODAL XÁC NHẬN TRẠNG THÁI -->
  <app-confirm-modal
    [isOpen]="showConfirmModal()"
    [title]="confirmModalTitle()"
    [message]="confirmModalMessage()"
    (isOpenChange)="showConfirmModal.set($event)"
    (confirm)="confirmModalAction()()"
  />
</div>
