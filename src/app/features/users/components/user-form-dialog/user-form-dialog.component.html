<p-dialog
  [visible]="visible"
  (visibleChange)="onVisibleChange($event)"
  [header]="(isEditMode ? 'users.dialog.editTitle' : 'users.dialog.createTitle') | translate"
  [modal]="true"
  [style]="{ width: '540px', maxWidth: '95vw' }"
  [draggable]="false"
  [resizable]="false"
  styleClass="dl-user-dialog"
  [dismissableMask]="true"
>
  <form [formGroup]="userForm" (ngSubmit)="onSubmit()" class="user-form-content">
    <!-- USERNAME (Chỉ cho phép nhập khi tạo mới) -->
    <app-form-field
      [label]="'users.dialog.usernameLabel' | translate"
      forId="username"
      [required]="true"
      [control]="userForm.get('username')"
      [errorMessages]="{
        pattern: ('users.dialog.usernamePatternError' | translate)
      }"
    >
      <input
        id="username"
        type="text"
        pInputText
        formControlName="username"
        [placeholder]="'users.dialog.usernamePlaceholder' | translate"
        class="dl-input"
        [class.ng-invalid]="isFieldInvalid('username')"
      />
    </app-form-field>

    <!-- HỌ VÀ TÊN -->
    <app-form-field
      [label]="'users.dialog.fullNameLabel' | translate"
      forId="fullName"
      [required]="true"
      [control]="userForm.get('fullName')"
    >
      <input
        id="fullName"
        type="text"
        pInputText
        formControlName="fullName"
        [placeholder]="'users.dialog.fullNamePlaceholder' | translate"
        class="dl-input"
        [class.ng-invalid]="isFieldInvalid('fullName')"
      />
    </app-form-field>

    <!-- EMAIL -->
    <app-form-field
      [label]="'users.dialog.emailLabel' | translate"
      forId="email"
      [required]="true"
      [control]="userForm.get('email')"
    >
      <input
        id="email"
        type="email"
        pInputText
        formControlName="email"
        [placeholder]="'users.dialog.emailPlaceholder' | translate"
        class="dl-input"
        [class.ng-invalid]="isFieldInvalid('email')"
      />
    </app-form-field>

    <!-- MẬT KHẨU (Chỉ bắt buộc khi tạo mới) -->
    @if (!isEditMode) {
      <app-form-field
        [label]="'users.dialog.passwordLabel' | translate"
        forId="password"
        [required]="true"
        [control]="userForm.get('password')"
      >
        <p-password
          id="password"
          formControlName="password"
          [toggleMask]="true"
          [feedback]="true"
          [promptLabel]="'users.dialog.passwordPrompt' | translate"
          [weakLabel]="'users.dialog.passwordWeak' | translate"
          [mediumLabel]="'users.dialog.passwordMedium' | translate"
          [strongLabel]="'users.dialog.passwordStrong' | translate"
          styleClass="w-full"
          inputStyleClass="w-full dl-input"
          [placeholder]="'users.dialog.passwordPlaceholder' | translate"
        />
      </app-form-field>
    }

    <!-- SỐ ĐIỆN THOẠI -->
    <app-form-field
      [label]="'users.dialog.phoneLabel' | translate"
      forId="phone"
      [control]="userForm.get('phone')"
      [errorMessages]="{
        pattern: ('users.dialog.phonePatternError' | translate)
      }"
    >
      <input
        id="phone"
        type="tel"
        pInputText
        formControlName="phone"
        [placeholder]="'users.dialog.phonePlaceholder' | translate"
        class="dl-input"
        [class.ng-invalid]="isFieldInvalid('phone')"
      />
    </app-form-field>

    <!-- VAI TRÒ GÁN (ROLES) -->
    <app-form-field
      [label]="'users.dialog.rolesLabel' | translate"
      forId="roleCodes"
      [hint]="'users.dialog.rolesHint' | translate"
    >
      <p-multiselect
        id="roleCodes"
        formControlName="roleCodes"
        [options]="roleOptions"
        optionLabel="label"
        optionValue="value"
        [placeholder]="'users.dialog.rolesPlaceholder' | translate"
        styleClass="w-full dl-multiselect"
        display="chip"
        [emptyMessage]="'users.dialog.rolesEmpty' | translate"
      />
    </app-form-field>

    <!-- DIALOG FOOTER -->
    <div class="dialog-actions">
      <app-button
        type="button"
        [label]="'common.actions.cancel' | translate"
        variant="secondary"
        (clicked)="onCancel()"
        [disabled]="submitting"
      />
      <app-button
        type="submit"
        [label]="(isEditMode ? 'users.dialog.editSubmit' : 'users.dialog.createSubmit') | translate"
        icon="pi pi-check"
        variant="primary"
        [loading]="submitting"
        [disabled]="submitting"
      />
    </div>
  </form>
</p-dialog>
