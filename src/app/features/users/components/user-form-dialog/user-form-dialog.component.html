<p-dialog
  [visible]="visible"
  (visibleChange)="onVisibleChange($event)"
  [header]="isEditMode ? 'Cập nhật thông tin người dùng' : 'Thêm mới người dùng'"
  [modal]="true"
  [style]="{ width: '540px', maxWidth: '95vw' }"
  [draggable]="false"
  [resizable]="false"
  styleClass="dl-user-dialog"
  [dismissableMask]="true"
>
  <form [formGroup]="userForm" (ngSubmit)="onSubmit()" class="user-form-content">
    <!-- USERNAME (Chỉ cho phép nhập khi tạo mới) -->
    <app-form-field
      label="Tên đăng nhập"
      forId="username"
      [required]="true"
      [control]="userForm.get('username')"
      [errorMessages]="{
        pattern: 'Tên đăng nhập chỉ chứa chữ cái, số và ký tự . _ -'
      }"
    >
      <input
        id="username"
        type="text"
        pInputText
        formControlName="username"
        placeholder="vd: nguyen_van_a"
        class="dl-input"
        [class.ng-invalid]="isFieldInvalid('username')"
      />
    </app-form-field>

    <!-- HỌ VÀ TÊN -->
    <app-form-field
      label="Họ và tên"
      forId="fullName"
      [required]="true"
      [control]="userForm.get('fullName')"
    >
      <input
        id="fullName"
        type="text"
        pInputText
        formControlName="fullName"
        placeholder="vd: Nguyễn Văn A"
        class="dl-input"
        [class.ng-invalid]="isFieldInvalid('fullName')"
      />
    </app-form-field>

    <!-- EMAIL -->
    <app-form-field
      label="Email liên hệ"
      forId="email"
      [required]="true"
      [control]="userForm.get('email')"
    >
      <input
        id="email"
        type="email"
        pInputText
        formControlName="email"
        placeholder="vd: nguyen.a@dongly.vn"
        class="dl-input"
        [class.ng-invalid]="isFieldInvalid('email')"
      />
    </app-form-field>

    <!-- MẬT KHẨU (Chỉ bắt buộc khi tạo mới) -->
    @if (!isEditMode) {
      <app-form-field
        label="Mật khẩu khởi tạo"
        forId="password"
        [required]="true"
        [control]="userForm.get('password')"
      >
        <p-password
          id="password"
          formControlName="password"
          [toggleMask]="true"
          [feedback]="true"
          promptLabel="Nhập mật khẩu an toàn"
          weakLabel="Yếu"
          mediumLabel="Trung bình"
          strongLabel="Mạnh"
          styleClass="w-full"
          inputStyleClass="w-full dl-input"
          placeholder="Tối thiểu 8 ký tự"
        />
      </app-form-field>
    }

    <!-- SỐ ĐIỆN THOẠI -->
    <app-form-field
      label="Số điện thoại"
      forId="phone"
      [control]="userForm.get('phone')"
      [errorMessages]="{
        pattern: 'Số điện thoại không đúng định dạng Việt Nam (10 số).'
      }"
    >
      <input
        id="phone"
        type="tel"
        pInputText
        formControlName="phone"
        placeholder="vd: 0987654321"
        class="dl-input"
        [class.ng-invalid]="isFieldInvalid('phone')"
      />
    </app-form-field>

    <!-- VAI TRÒ GÁN (ROLES) -->
    <app-form-field
      label="Vai trò trong hệ thống"
      forId="roleCodes"
      hint="Người dùng sẽ nhận tập hợp quyền tương ứng từ các vai trò này."
    >
      <p-multiselect
        id="roleCodes"
        formControlName="roleCodes"
        [options]="roleOptions"
        optionLabel="label"
        optionValue="value"
        placeholder="Chọn vai trò (mặc định: Khách hàng)"
        styleClass="w-full dl-multiselect"
        display="chip"
        emptyMessage="Không có vai trò nào"
      />
    </app-form-field>

    <!-- DIALOG FOOTER -->
    <div class="dialog-actions">
      <p-button
        type="button"
        label="Hủy bỏ"
        severity="secondary"
        [outlined]="true"
        (onClick)="onCancel()"
        [disabled]="submitting"
      />
      <p-button
        type="submit"
        [label]="isEditMode ? 'Lưu thay đổi' : 'Tạo tài khoản'"
        [icon]="submitting ? 'pi pi-spin pi-spinner' : 'pi pi-check'"
        severity="danger"
        [disabled]="submitting"
      />
    </div>
  </form>
</p-dialog>
