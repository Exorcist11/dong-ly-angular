<p-dialog
  [visible]="visible"
  [modal]="true"
  [closable]="!submitting"
  [dismissableMask]="!submitting"
  [header]="(isEditMode ? 'roles.dialog.editTitle' : 'roles.dialog.createTitle') | translate"
  styleClass="dl-role-dialog"
  [style]="{ width: '480px', maxWidth: '95vw' }"
  (visibleChange)="visibleChange.emit($event)"
>
  <form [formGroup]="roleForm" (ngSubmit)="onSubmit()" class="role-form-content">
    @if (isSystemRole) {
      <div class="system-role-notice">
        <i class="pi pi-shield"></i>
        <div class="notice-text">
          <strong>{{ 'roles.dialog.systemRoleNoticeTitle' | translate }}</strong>
          <span>{{ 'roles.dialog.systemRoleNoticeDesc' | translate }}</span>
        </div>
      </div>
    }

    <!-- Mã vai trò -->
    <app-input
      id="roleCode"
      formControlName="code"
      [label]="'roles.dialog.codeLabel' | translate"
      type="text"
      [required]="!isEditMode"
      [hint]="'roles.dialog.codeHint' | translate"
      [placeholder]="'roles.dialog.codePlaceholder' | translate"
      [errorMessages]="{
        pattern: ('roles.dialog.codePatternError' | translate)
      }"
      (input)="onCodeInput($event)"
    >
      @if (isEditMode) {
        <span labelSuffix class="readonly-badge">{{ 'roles.dialog.codeReadonly' | translate }}</span>
      }
    </app-input>

    <!-- Tên vai trò hiển thị -->
    <app-input
      id="roleName"
      formControlName="name"
      [label]="'roles.dialog.nameLabel' | translate"
      type="text"
      [required]="true"
      [placeholder]="'roles.dialog.namePlaceholder' | translate"
    />

    <!-- Mô tả vai trò -->
    <app-form-field
      [label]="'roles.dialog.descLabel' | translate"
      forId="roleDescription"
      [control]="roleForm.get('description')"
    >
      <textarea
        pTextarea
        id="roleDescription"
        formControlName="description"
        rows="3"
        [placeholder]="'roles.dialog.descPlaceholder' | translate"
        class="dl-textarea"
        [class.ng-invalid]="roleForm.get('description')?.invalid && roleForm.get('description')?.touched"
      ></textarea>
    </app-form-field>

    <!-- Actions -->
    <div class="dialog-actions">
      <app-button
        [label]="'common.actions.cancel' | translate"
        icon="pi pi-times"
        variant="secondary"
        (clicked)="onClose()"
        [disabled]="submitting"
      />

      <app-button
        type="submit"
        [label]="(isEditMode ? 'roles.dialog.editSubmit' : 'roles.dialog.createSubmit') | translate"
        icon="pi pi-check"
        variant="primary"
        [loading]="submitting"
        [disabled]="submitting"
      />
    </div>
  </form>
</p-dialog>
