<p-dialog
  [visible]="visible"
  [modal]="true"
  [closable]="!submitting"
  [dismissableMask]="!submitting"
  [header]="isEditMode ? 'Chỉnh sửa thông tin vai trò' : 'Thêm mới vai trò'"
  styleClass="dl-role-dialog"
  [style]="{ width: '480px', maxWidth: '95vw' }"
  (visibleChange)="visibleChange.emit($event)"
>
  <form [formGroup]="roleForm" (ngSubmit)="onSubmit()" class="role-form-content">
    @if (isSystemRole) {
      <div class="system-role-notice">
        <i class="pi pi-shield"></i>
        <div class="notice-text">
          <strong>Vai trò hệ thống được bảo vệ:</strong>
          <span>Mã định danh và trạng thái được hệ thống khóa cố định. Bạn chỉ có thể cập nhật tên hiển thị và mô tả.</span>
        </div>
      </div>
    }

    <!-- Mã vai trò -->
    <app-form-field
      label="Mã vai trò"
      forId="roleCode"
      [required]="!isEditMode"
      [control]="roleForm.get('code')"
      hint="Mã định danh duy nhất (chữ in hoa, số và gạch dưới). Ví dụ: DISPATCHER, AGENT."
      [errorMessages]="{
        pattern: 'Chỉ được chứa chữ cái, số và dấu gạch dưới (_).'
      }"
    >
      @if (isEditMode) {
        <span labelSuffix class="readonly-badge">Không thể sửa</span>
      }
      <input
        pInputText
        id="roleCode"
        formControlName="code"
        placeholder="Ví dụ: TICKET_INSPECTOR, MODERATOR"
        class="dl-input"
        [class.ng-invalid]="roleForm.get('code')?.invalid && roleForm.get('code')?.touched"
        (input)="onCodeInput($event)"
      />
    </app-form-field>

    <!-- Tên vai trò hiển thị -->
    <app-form-field
      label="Tên vai trò"
      forId="roleName"
      [required]="true"
      [control]="roleForm.get('name')"
    >
      <input
        pInputText
        id="roleName"
        formControlName="name"
        placeholder="Ví dụ: Soát vé & Điều độ"
        class="dl-input"
        [class.ng-invalid]="roleForm.get('name')?.invalid && roleForm.get('name')?.touched"
      />
    </app-form-field>

    <!-- Mô tả vai trò -->
    <app-form-field
      label="Mô tả chức năng"
      forId="roleDescription"
      [control]="roleForm.get('description')"
    >
      <textarea
        pTextarea
        id="roleDescription"
        formControlName="description"
        rows="3"
        placeholder="Mô tả phạm vi quyền hạn và trách nhiệm của vai trò này..."
        class="dl-textarea"
        [class.ng-invalid]="roleForm.get('description')?.invalid && roleForm.get('description')?.touched"
      ></textarea>
    </app-form-field>

    <!-- Actions -->
    <div class="dialog-actions">
      <p-button
        label="Hủy bỏ"
        icon="pi pi-times"
        severity="secondary"
        [outlined]="true"
        (onClick)="onClose()"
        [disabled]="submitting"
      />

      <p-button
        type="submit"
        [label]="isEditMode ? 'Lưu thay đổi' : 'Tạo vai trò'"
        icon="pi pi-check"
        severity="primary"
        [loading]="submitting"
        [disabled]="submitting"
      />
    </div>
  </form>
</p-dialog>
