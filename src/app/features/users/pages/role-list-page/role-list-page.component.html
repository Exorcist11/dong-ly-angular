<div class="role-list-page">
  <!-- PAGE HEADER -->
  <app-page-header
    title="Quản lý Vai trò & Phân quyền"
    [breadcrumbs]="[
      { label: 'Hệ thống' },
      { label: 'Vai trò & Phân quyền' }
    ]"
  >
    <div actions class="header-actions">
      <p-button
        *appHasPermission="'ROLE_CREATE'"
        label="Thêm vai trò mới"
        icon="pi pi-plus"
        severity="primary"
        (onClick)="openCreateDialog()"
      />
    </div>
  </app-page-header>

  <!-- FILTER & SEARCH BAR -->
  <div class="filter-card">
    <div class="search-box">
      <app-search-input
        [value]="searchTerm()"
        (searchChange)="onSearch($event)"
        (clear)="onSearch('')"
        placeholder="Tìm theo mã hoặc tên vai trò..."
      />
    </div>

    <div class="filter-controls">
      <p-select
        [options]="statusFilterOptions"
        [ngModel]="selectedStatus()"
        (ngModelChange)="onStatusFilterChange($event)"
        optionLabel="label"
        optionValue="value"
        placeholder="Lọc trạng thái"
        class="status-select"
      />

      @if (isFiltered()) {
        <p-button
          label="Đặt lại"
          icon="pi pi-filter-slash"
          severity="secondary"
          [outlined]="true"
          (onClick)="onResetFilters()"
          styleClass="reset-btn"
        />
      }
    </div>
  </div>

  <!-- DATA TABLE -->
  <div class="table-card">
    <app-data-table
      [data]="roles()"
      [columns]="columns"
      [loading]="loading()"
      [lazy]="true"
      (lazyLoad)="onLazyLoad($event)"
      [paginator]="true"
      [first]="currentPage() * pageSize()"
      [pageSize]="pageSize()"
      [totalRecords]="totalRecords()"
      [rowsPerPageOptions]="[10, 20, 50]"
      currentPageReportTemplate="Hiển thị {first} đến {last} trong tổng số {totalRecords} vai trò"
      [tableStyleClass]="'p-datatable-striped dl-table'"
      minWidth="960px"
      [emptyTitle]="isFiltered() ? 'Không tìm thấy vai trò phù hợp' : 'Chưa có vai trò nào trong hệ thống'"
      [emptyMessage]="isFiltered() ? 'Vui lòng thử lại với từ khóa hoặc bộ lọc khác.' : 'Hệ thống chưa ghi nhận vai trò nào.'"
      emptyIcon="pi pi-shield"
    >
      <!-- CỘT 1: MÃ VAI TRÒ -->
      <ng-template appTableCell="code" let-role>
        <span class="role-code-badge">{{ role.code }}</span>
      </ng-template>

      <!-- CỘT 2: TÊN VAI TRÒ -->
      <ng-template appTableCell="name" let-role>
        <div class="role-name-cell">
          <span class="role-name">{{ role.name }}</span>
        </div>
      </ng-template>

      <!-- CỘT 3: LOẠI VAI TRÒ -->
      <ng-template appTableCell="isSystem" let-role>
        <app-status-badge
          [status]="role.isSystem ? 'SYSTEM' : 'CUSTOM'"
          [label]="role.isSystem ? 'Hệ thống' : 'Tùy chỉnh'"
          [styleClass]="role.isSystem ? 'system-tag' : 'custom-tag'"
          [pTooltip]="role.isSystem ? 'Vai trò nền tảng được bảo vệ toàn vẹn' : undefined"
          tooltipPosition="top"
        />
      </ng-template>

      <!-- CỘT 4: MÔ TẢ -->
      <ng-template appTableCell="description" let-role>
        <span class="role-desc">
          {{ role.description || 'Chưa có mô tả' }}
        </span>
      </ng-template>

      <!-- CỘT 5: SỐ QUYỀN HẠN -->
      <ng-template appTableCell="permissionCount" let-role>
        <button
          type="button"
          class="permission-count-pill"
          [pTooltip]="'Nhấn để xem ma trận phân quyền'"
          tooltipPosition="top"
          (click)="openMatrixDialog(role)"
        >
          <i class="pi pi-key key-icon"></i>
          <span>{{ role.permissionCount ?? 0 }} quyền</span>
        </button>
      </ng-template>

      <!-- CỘT 6: TRẠNG THÁI -->
      <ng-template appTableCell="status" let-role>
        <app-status-badge [status]="role.status" />
      </ng-template>

      <!-- CỘT 7: NGÀY TẠO -->
      <ng-template appTableCell="createdAt" let-role>
        <span class="date-text">{{ role.createdAt | dateVi }}</span>
      </ng-template>

      <!-- CỘT 8: THAO TÁC -->
      <ng-template appTableCell="actions" let-role>
        <div class="action-buttons">
          <!-- Nút Ma trận phân quyền -->
          <p-button
            *appHasPermission="'ROLE_ASSIGN'"
            icon="pi pi-shield"
            severity="primary"
            [text]="true"
            size="small"
            pTooltip="Phân quyền vai trò"
            tooltipPosition="top"
            (onClick)="openMatrixDialog(role)"
          />

          <!-- Nút Sửa vai trò -->
          <p-button
            *appHasPermission="'ROLE_UPDATE'"
            icon="pi pi-pencil"
            severity="secondary"
            [text]="true"
            size="small"
            pTooltip="Sửa thông tin"
            tooltipPosition="top"
            (onClick)="openEditDialog(role)"
          />

          <!-- Nút Khóa / Mở khóa -->
          @if (!role.isSystem) {
            <p-button
              *appHasPermission="'ROLE_UPDATE'"
              [icon]="role.status === 'ACTIVE' ? 'pi pi-lock' : 'pi pi-lock-open'"
              [severity]="role.status === 'ACTIVE' ? 'warn' : 'success'"
              [text]="true"
              size="small"
              [pTooltip]="role.status === 'ACTIVE' ? 'Tạm khóa vai trò' : 'Kích hoạt vai trò'"
              tooltipPosition="top"
              (onClick)="confirmStatusChange(role)"
            />
          } @else {
            <span
              pTooltip="Vai trò hệ thống luôn ở trạng thái hoạt động"
              tooltipPosition="top"
              class="disabled-action-placeholder"
            >
              <i class="pi pi-lock system-lock-icon"></i>
            </span>
          }

          <!-- Nút Xóa (Chỉ cho vai trò tùy chỉnh) -->
          @if (!role.isSystem) {
            <p-button
              *appHasPermission="'ROLE_DELETE'"
              icon="pi pi-trash"
              severity="danger"
              [text]="true"
              size="small"
              pTooltip="Xóa vai trò"
              tooltipPosition="top"
              (onClick)="confirmDeleteRole(role)"
            />
          }
        </div>
      </ng-template>
    </app-data-table>
  </div>

  <!-- DIALOG FORM VAI TRÒ -->
  <app-role-form-dialog
    [visible]="roleFormVisible()"
    [role]="selectedRoleForEdit()"
    [submitting]="submittingForm()"
    (visibleChange)="roleFormVisible.set($event)"
    (save)="onSaveRole($event)"
  />

  <!-- DIALOG MA TRẬN PHÂN QUYỀN -->
  @if (selectedRoleForMatrix()) {
    <app-role-permission-matrix
      [visible]="matrixVisible()"
      [roleId]="selectedRoleForMatrix()!.id"
      [roleName]="selectedRoleForMatrix()!.name"
      [roleCode]="selectedRoleForMatrix()!.code"
      [isSystemRole]="selectedRoleForMatrix()!.isSystem"
      (visibleChange)="matrixVisible.set($event)"
      (permissionsSaved)="onPermissionsSaved()"
    />
  }

  <!-- MODAL XÁC NHẬN ĐỔI TRẠNG THÁI -->
  <app-confirm-modal
    [isOpen]="statusConfirmVisible()"
    [title]="pendingStatus() === 'ACTIVE' ? 'Kích hoạt vai trò' : 'Tạm khóa vai trò'"
    [message]="
      'Bạn có chắc chắn muốn ' +
      (pendingStatus() === 'ACTIVE' ? 'kích hoạt' : 'tạm khóa') +
      ' vai trò ' +
      (roleForStatusChange()?.name || '') +
      '?'
    "
    [confirmText]="pendingStatus() === 'ACTIVE' ? 'Kích hoạt' : 'Tạm khóa'"
    [danger]="pendingStatus() === 'INACTIVE'"
    (confirm)="onExecuteStatusChange()"
    (cancel)="statusConfirmVisible.set(false)"
  />

  <!-- MODAL XÁC NHẬN XÓA VAI TRÒ -->
  <app-confirm-modal
    [isOpen]="deleteConfirmVisible()"
    title="Xóa vai trò tùy chỉnh"
    [message]="
      'Hành động này sẽ xóa vĩnh viễn vai trò &quot;' +
      (roleForDelete()?.name || '') +
      '&quot;. Nếu có người dùng đang giữ vai trò này, hệ thống sẽ từ chối thao tác. Bạn có chắc chắn muốn xóa?'
    "
    confirmText="Xóa vai trò"
    [danger]="true"
    (confirm)="onExecuteDeleteRole()"
    (cancel)="deleteConfirmVisible.set(false)"
  />
</div>
