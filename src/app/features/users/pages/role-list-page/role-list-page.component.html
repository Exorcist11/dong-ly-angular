<div class="role-list-page">
  <!-- PAGE HEADER -->
  <app-page-header
    [title]="'roles.title' | translate"
    [breadcrumbs]="breadcrumbs()"
  >
    <div actions class="header-actions">
      <p-button
        *appHasPermission="'ROLE_CREATE'"
        [label]="'roles.actions.create' | translate"
        icon="pi pi-plus"
        severity="primary"
        (onClick)="openCreateDialog()"
      />
    </div>
  </app-page-header>

  <!-- DATA TABLE -->
  <div class="table-card">
    <app-data-table
      [data]="roles()"
      [columns]="columns()"
      [loading]="loading()"
      [lazy]="true"
      (lazyLoad)="onLazyLoad($event)"
      [paginator]="true"
      [first]="currentPage() * pageSize()"
      [pageSize]="pageSize()"
      [totalRecords]="totalRecords()"
      [rowsPerPageOptions]="[10, 20, 50]"
      [currentPageReportTemplate]="'roles.pageReport' | translate"
      [tableStyleClass]="'p-datatable-striped dl-table'"
      minWidth="960px"
      [emptyTitle]="(isFiltered() ? 'roles.emptyFilteredTitle' : 'roles.emptySystemTitle') | translate"
      [emptyMessage]="(isFiltered() ? 'roles.emptyFilteredMessage' : 'roles.emptySystemMessage') | translate"
      emptyIcon="pi pi-shield"
      [searchable]="true"
      [searchValue]="searchTerm()"
      [searchPlaceholder]="'roles.searchPlaceholder' | translate"
      (searchChange)="onSearch($event)"
      [filters]="tableFilters()"
      (filterChange)="onFilterChange($event)"
      [showResetFilters]="isFiltered()"
      (resetFilters)="onResetFilters()"
      [showRefresh]="true"
      (refresh)="loadRoles()"
    >
      <!-- CỘT 1: MÃ VAI TRÒ -->
      <ng-template appTableCell="code" let-role>
        <span class="role-code-badge">{{ role.code }}</span>
      </ng-template>

      <!-- CỘT 2: TÊN VAI TRÒ -->
      <ng-template appTableCell="name" let-role>
        <div class="role-name-cell">
          <span class="role-name">{{ role.name }}</span>
        </div>
      </ng-template>

      <!-- CỘT 3: LOẠI VAI TRÒ -->
      <ng-template appTableCell="isSystem" let-role>
        <app-status-badge
          [status]="role.isSystem ? 'SYSTEM' : 'CUSTOM'"
          [label]="(role.isSystem ? 'common.status.system' : 'common.status.custom') | translate"
          [styleClass]="role.isSystem ? 'system-tag' : 'custom-tag'"
          [pTooltip]="role.isSystem ? ('roles.systemProtectedTooltip' | translate) : undefined"
          tooltipPosition="top"
        />
      </ng-template>

      <!-- CỘT 4: MÔ TẢ -->
      <ng-template appTableCell="description" let-role>
        <span class="role-desc">
          {{ role.description || ('roles.noDescription' | translate) }}
        </span>
      </ng-template>

      <!-- CỘT 5: SỐ QUYỀN HẠN -->
      <ng-template appTableCell="permissionCount" let-role>
        <button
          type="button"
          class="permission-count-pill"
          [pTooltip]="'roles.matrixCountTooltip' | translate"
          tooltipPosition="top"
          (click)="openMatrixDialog(role)"
        >
          <i class="pi pi-key key-icon"></i>
          <span>{{ 'roles.permissionCountLabel' | translate:{ count: role.permissionCount ?? 0 } }}</span>
        </button>
      </ng-template>

      <!-- CỘT 6: TRẠNG THÁI -->
      <ng-template appTableCell="status" let-role>
        <app-status-badge [status]="role.status" />
      </ng-template>

      <!-- CỘT 7: NGÀY TẠO -->
      <ng-template appTableCell="createdAt" let-role>
        <span class="date-text">{{ role.createdAt | dateVi }}</span>
      </ng-template>

      <!-- CỘT 8: THAO TÁC -->
      <ng-template appTableCell="actions" let-role>
        <div class="action-buttons">
          <!-- Nút Ma trận phân quyền -->
          <p-button
            *appHasPermission="'ROLE_ASSIGN'"
            icon="pi pi-shield"
            severity="primary"
            [text]="true"
            size="small"
            [pTooltip]="'roles.actions.matrix' | translate"
            tooltipPosition="top"
            (onClick)="openMatrixDialog(role)"
          />

          <!-- Nút Sửa vai trò -->
          <p-button
            *appHasPermission="'ROLE_UPDATE'"
            icon="pi pi-pencil"
            severity="secondary"
            [text]="true"
            size="small"
            [pTooltip]="'roles.actions.edit' | translate"
            tooltipPosition="top"
            (onClick)="openEditDialog(role)"
          />

          <!-- Nút Khóa / Mở khóa -->
          @if (!role.isSystem) {
            <p-button
              *appHasPermission="'ROLE_UPDATE'"
              [icon]="role.status === 'ACTIVE' ? 'pi pi-lock' : 'pi pi-lock-open'"
              [severity]="role.status === 'ACTIVE' ? 'warn' : 'success'"
              [text]="true"
              size="small"
              [pTooltip]="(role.status === 'ACTIVE' ? 'roles.actions.lock' : 'roles.actions.unlock') | translate"
              tooltipPosition="top"
              (onClick)="confirmStatusChange(role)"
            />
          } @else {
            <span
              [pTooltip]="'roles.systemActiveTooltip' | translate"
              tooltipPosition="top"
              class="disabled-action-placeholder"
            >
              <i class="pi pi-lock system-lock-icon"></i>
            </span>
          }

          <!-- Nút Xóa (Chỉ cho vai trò tùy chỉnh) -->
          @if (!role.isSystem) {
            <p-button
              *appHasPermission="'ROLE_DELETE'"
              icon="pi pi-trash"
              severity="danger"
              [text]="true"
              size="small"
              [pTooltip]="'roles.actions.delete' | translate"
              tooltipPosition="top"
              (onClick)="confirmDeleteRole(role)"
            />
          }
        </div>
      </ng-template>
    </app-data-table>
  </div>

  <!-- DIALOG FORM VAI TRÒ -->
  <app-role-form-dialog
    [visible]="roleFormVisible()"
    [role]="selectedRoleForEdit()"
    [submitting]="submittingForm()"
    (visibleChange)="roleFormVisible.set($event)"
    (save)="onSaveRole($event)"
  />

  <!-- DIALOG MA TRẬN PHÂN QUYỀN -->
  @if (selectedRoleForMatrix()) {
    <app-role-permission-matrix
      [visible]="matrixVisible()"
      [roleId]="selectedRoleForMatrix()!.id"
      [roleName]="selectedRoleForMatrix()!.name"
      [roleCode]="selectedRoleForMatrix()!.code"
      [isSystemRole]="selectedRoleForMatrix()!.isSystem"
      (visibleChange)="matrixVisible.set($event)"
      (permissionsSaved)="onPermissionsSaved()"
    />
  }

  <!-- MODAL XÁC NHẬN ĐỔI TRẠNG THÁI -->
  <app-confirm-modal
    [isOpen]="statusConfirmVisible()"
    [title]="(pendingStatus() === 'ACTIVE' ? 'roles.statusModal.activateTitle' : 'roles.statusModal.lockTitle') | translate"
    [message]="'roles.statusModal.message' | translate:{
      action: (pendingStatus() === 'ACTIVE' ? 'roles.statusModal.actionActivate' : 'roles.statusModal.actionLock') | translate,
      name: (roleForStatusChange()?.name || '')
    }"
    [confirmText]="(pendingStatus() === 'ACTIVE' ? 'roles.statusModal.confirmActivate' : 'roles.statusModal.confirmLock') | translate"
    [danger]="pendingStatus() === 'INACTIVE'"
    (confirm)="onExecuteStatusChange()"
    (cancel)="statusConfirmVisible.set(false)"
  />

  <!-- MODAL XÁC NHẬN XÓA VAI TRÒ -->
  <app-confirm-modal
    [isOpen]="deleteConfirmVisible()"
    [title]="'roles.deleteModal.title' | translate"
    [message]="'roles.deleteModal.message' | translate:{ name: (roleForDelete()?.name || '') }"
    [confirmText]="'roles.deleteModal.confirm' | translate"
    [danger]="true"
    (confirm)="onExecuteDeleteRole()"
    (cancel)="deleteConfirmVisible.set(false)"
  />
</div>
